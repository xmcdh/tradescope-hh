<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeScope UI Test Harness</title>
  </head>
  <body>
    <div id="root"></div>
    <pre id="captured" style="white-space: pre-wrap; color: #fff; background: #111827; padding: 16px; margin: 16px;"></pre>

    <script>
      const captured = document.getElementById('captured');
      const clipboardWrites = [];
      const diagnostics = [];

      function writeDiagnostics() {
        const sections = [];
        if (diagnostics.length) {
          sections.push(`diagnostics:\n${diagnostics.join('\n')}`);
        }
        if (clipboardWrites.length) {
          sections.push(clipboardWrites.join('\n\n-----\n\n'));
        }
        captured.textContent = sections.join('\n\n=====\n\n');
      }

      window.addEventListener('error', (event) => {
        diagnostics.push(`error: ${event.message}`);
        writeDiagnostics();
      });

      window.addEventListener('unhandledrejection', (event) => {
        diagnostics.push(`rejection: ${String(event.reason)}`);
        writeDiagnostics();
      });

      const now = Date.now();
      const candles = Array.from({ length: 200 }, (_, index) => {
        const openTime = now - (200 - index) * 15 * 60 * 1000;
        const base = 0.061 + index * 0.00003;
        const open = base.toFixed(5);
        const high = (base + 0.0008).toFixed(5);
        const low = (base - 0.0005).toFixed(5);
        const close = (base + 0.00055).toFixed(5);
        const volume = index === 199 ? '420000' : `${90000 + index * 500}`;

        return [String(openTime), open, high, low, close, volume];
      });

      window.localStorage.setItem('tradescope:watchlist', JSON.stringify(['UBUSDT']));
      window.localStorage.setItem('tradescope:history', JSON.stringify([]));

      const originalFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const url = typeof input === 'string' ? input : input.url;

        if (url.includes('api.binance.com')) {
          return new Response(JSON.stringify({ code: -1121, msg: 'Invalid symbol.' }), {
            status: 400,
            headers: { 'Content-Type': 'application/json' },
          });
        }

        if (url.includes('api.bybit.com')) {
          return new Response(
            JSON.stringify({
              retCode: 0,
              retMsg: 'OK',
              result: {
                category: 'linear',
                symbol: 'UBUSDT',
                list: candles.slice().reverse(),
              },
            }),
            {
              status: 200,
              headers: { 'Content-Type': 'application/json' },
            },
          );
        }

        return originalFetch(input, init);
      };

      class MockWebSocket {
        constructor() {
          setTimeout(() => {
            this.onerror?.(new Event('error'));
          }, 10);
        }

        close() {}
      }

      window.WebSocket = MockWebSocket;

      Object.defineProperty(window.navigator, 'clipboard', {
        configurable: true,
        value: {
          async writeText(text) {
            clipboardWrites.push(text);
            writeDiagnostics();
          },
        },
      });

      let clicked = false;

      function clickWhenReady() {
        if (clicked) {
          return true;
        }

        const promptButton = Array.from(document.querySelectorAll('button')).find((button) =>
          button.textContent.includes('Copy AI Prompt'),
        );
        const signalButton = Array.from(document.querySelectorAll('button')).find((button) =>
          button.textContent.includes('Copy Signal'),
        );

        if (!promptButton || !signalButton) {
          return false;
        }

        clicked = true;
        promptButton.click();
        signalButton.click();
        return true;
      }

      const observer = new MutationObserver(() => {
        if (clickWhenReady()) {
          observer.disconnect();
        }
      });

      observer.observe(document.documentElement, { childList: true, subtree: true });

      setTimeout(() => {
        clickWhenReady();
      }, 2500);
    </script>
    <script type="module">
      import('/src/main.jsx').catch((error) => {
        diagnostics.push(`import: ${error.message}`);
        writeDiagnostics();
      });
    </script>
  </body>
</html>
